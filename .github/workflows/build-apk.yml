name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project files
        run: unzip -o maira-ai-assistant-fixed.zip -d .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (needed for Android build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install web dependencies
        run: npm install

      - name: Build the web app (dist folder)
        run: npm run build:static

      - name: Add Android platform
        run: npx cap add android

      - name: Add microphone permission to AndroidManifest.xml
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />#' android/app/src/main/AndroidManifest.xml

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Give Gradle wrapper permission to execute
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: maira-ai-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
